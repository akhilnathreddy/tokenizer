name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" regex
      - name: Run tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          toklab train data/corpus.txt --model bpe --vocab-size 500 -o bpe.json
          toklab encode -m bpe.json "Hello tokenizer world"
          toklab encode --gpt2 "Hello world"
