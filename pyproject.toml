[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toklab"
version = "0.1.0"
description = "Word-level and sub-word (byte-level BPE, WordPiece) tokenizers written from scratch, with a web visualizer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "akhilnathreddy" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
crosscheck = ["regex", "tiktoken"]

[project.scripts]
toklab = "toklab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
